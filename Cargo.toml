[package]
name = "minibookx-ctl"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "Apache-2.0"
description = "Bounded hardware control for the tested CHUWI MiniBook X U300 revision"

[features]
# Read-only policy experiments for source builds, excluded from release binaries.
dev-tools = []
# Separate hardware-free VM fixture; never part of a normal or release build.
systemd-test-fixture = []

[[bin]]
name = "minibookx-systemd-fixture"
path = "tests/systemd/fixture.rs"
required-features = ["systemd-test-fixture"]

[dependencies]
libc = "=0.2.189"
dbus = { version = "=0.9.12", features = ["stdfd"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }

[lints.clippy]
# Every FFI or raw-descriptor block states the invariant it relies on.
undocumented_unsafe_blocks = "warn"

[profile.dev]
# A forked child must never unwind through inherited parent-side FD owners.
panic = "abort"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
