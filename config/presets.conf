# User-editable fan presets. Active preset changes are applied automatically.
# PWM is electrical duty, not percentage of maximum RPM.
preset = balance
# Fan control is a startup choice; changing it requires a service restart.
fan_control = true
# CPU power overrides require explicit values and a separate opt-in.
power_control = false

[balance]
pl1_w = firmware
pl2_w = firmware
curve = 60:35,85:40,90:50,93:70
hysteresis_c = 5
start_hold_s = 12
up_hold_s = 20
min_on_s = 45
down_hold_s = 30
emergency_c = 95
idle_interval_ms = 5000
active_interval_ms = 1000

# Prioritize silence: the fan starts after 20 s of accumulated heat from 80 C;
# 45 s continuously below 75 C clears that budget. A running fan stops below
# 75 C after the cooling/minimum-on holds.
[quiet]
pl1_w = firmware
pl2_w = firmware
curve = 80:35,88:40,92:50,94:70
hysteresis_c = 5
start_hold_s = 20
up_hold_s = 30
min_on_s = 45
down_hold_s = 45
emergency_c = 95
idle_interval_ms = 5000
active_interval_ms = 1000

# Earlier cooling. This is a custom curve, not an exact copy of EC firmware.
[performance]
pl1_w = firmware
pl2_w = firmware
curve = 50:35,55:50,65:60,75:70,82:80
hysteresis_c = 5
start_hold_s = 3
up_hold_s = 5
min_on_s = 45
down_hold_s = 20
emergency_c = 95
idle_interval_ms = 5000
active_interval_ms = 1000
